[tool.poetry]
name = "ad_redirector"
version = "2.0.0"
description = "Direct-link redirector for JuicyAds codes with click tracking"
authors = ["Dario <timmy.dario@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
django = "^6.1"
psycopg = { extras = ["binary"], version = "^3.3" }
gunicorn = "^26.2"
whitenoise = "^6.12"
celery = {extras = ["redis"], version = "^5.6.3"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
