<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Ad Redirector</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1d2330;
      --muted: #5f6b7a;
      --accent: #2f6fde;
      --border: #e2e6ec;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151b;
        --card: #1b1f27;
        --text: #e6e9ef;
        --muted: #9aa5b4;
        --accent: #6c9ef8;
        --border: #2a303b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .card {
      max-width: 520px;
      width: 100%;
      padding: 40px 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { margin: 0; color: var(--muted); }
    footer {
      padding: 16px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Ad Redirector</h1>
      <p>This service forwards shared links to their destination. If you followed a link here, check that it was copied completely.</p>
    </div>
  </main>
  <footer>
    {# Attribution required by the MaxMind GeoLite2 EULA. #}
    This product includes GeoLite2 data created by MaxMind, available from
    <a href="https://www.maxmind.com">https://www.maxmind.com</a>.
  </footer>
</body>
</html>
