<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Redirecting…</title>
  <style>
    :root { --bg: #f6f7f9; --text: #1d2330; --muted: #5f6b7a; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #12151b; --text: #e6e9ef; --muted: #9aa5b4; }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    p { margin: 0; }
    #cookies { display: none; color: var(--muted); }
  </style>
</head>
<body>
  <p id="wait">Redirecting…</p>
  <p id="cookies">Please enable cookies to continue.</p>
  <noscript><p>Please enable JavaScript to continue.</p></noscript>
  <script>
    (function () {
      var name = "{{ cookie_name|escapejs }}";
      document.cookie = name + "={{ token|escapejs }}; path=/; max-age={{ cookie_max_age }}; SameSite=Lax";
      if (document.cookie.indexOf(name + "=") === -1) {
        // Cookies are blocked; reloading would loop forever.
        document.getElementById("wait").style.display = "none";
        document.getElementById("cookies").style.display = "block";
        return;
      }
      location.replace(location.href);
    })();
  </script>
</body>
</html>
